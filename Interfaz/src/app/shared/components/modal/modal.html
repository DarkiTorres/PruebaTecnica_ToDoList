<div class="modal-overlay">

  <div class="modal">

    <button
      type="button"
      class="btn-cerrar"
      (click)="cerrarModal()"
    >
      ×
    </button>

    <div class="modal-icono">
      ⚠️
    </div>

    <h2>
      {{ titulo }}
    </h2>

    <p>
      {{ mensaje }}
    </p>

    <div class="modal-footer">

      @if (esConfirmacion) {

        <button
          type="button"
          class="btn-cancelar"
          (click)="cerrarModal()"
        >
          Cancelar
        </button>

        <button
          type="button"
          class="btn-confirmar"
          (click)="confirmarModal()"
        >
          Eliminar
        </button>

      } @else {

        <button
          type="button"
          class="btn-aceptar"
          (click)="cerrarModal()"
        >
          Aceptar
        </button>

      }

    </div>

  </div>

</div>
